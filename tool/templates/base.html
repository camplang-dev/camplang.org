<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% block title %}{% if page %}{{ page.title }} | {{ config.title }}{% elif section %}{{ section.title }} | {{ config.title }}{% else %}{{ config.title }}{% endif %}{% endblock title %}</title>
	<meta name="description" content="{% if page and page.description %}{{ page.description }}{% elif section and section.description %}{{ section.description }}{% else %}{{ config.description }}{% endif %}">
	<link rel="icon" href="/images/campfire-logo.png">
	<link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="preload" href="/fonts/inter-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="preload" href="/fonts/inter-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="preload" href="/fonts/roboto-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="stylesheet" href="/site.css">
	{% block head_extra %}{% endblock head_extra %}
</head>
<body class="{% block body_class %}{% endblock body_class %}">
	<a class="skip-link" href="#main">Skip to content</a>
	<header class="site-header">
		<div class="site-header__inner">
			<a class="brand" href="/" aria-label="Camp home">
				<img class="brand__mark" src="/images/campfire-logo.png" alt="">
				<span class="brand__name">CAMP</span>
			</a>
			<nav class="site-nav" aria-label="Primary navigation">
				<a href="/docs/language/01-camp-in-one-page/">Learn</a>
				<a href="/install/">Install</a>
				<a href="{{ config.extra.github_url }}">GitHub</a>
			</nav>
		</div>
	</header>
	<main id="main">
		{% block content %}{% endblock content %}
	</main>
	<footer class="site-footer">
		<div class="site-footer__inner">
			<p>Camp is a modern native programming language with durable foundations.</p>
			<nav aria-label="Footer navigation">
				<a href="/docs/language/">Language Guide</a>
				<a href="/docs/compiler/">Compiler Guide</a>
				<a href="{{ config.extra.github_url }}">Compiler Source</a>
			</nav>
		</div>
	</footer>
	<script>
		document.querySelectorAll("[data-copy]").forEach((button) => {
			button.addEventListener("click", async () => {
				await navigator.clipboard.writeText(button.dataset.copy);
				button.classList.add("is-copied");
				button.setAttribute("aria-label", "Copied");
				window.setTimeout(() => {
					button.classList.remove("is-copied");
					button.setAttribute("aria-label", "Copy command");
				}, 1400);
			});
		});
	</script>
	{% block scripts %}{% endblock scripts %}
</body>
</html>
